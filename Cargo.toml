[workspace]
resolver = "2"
members = ["crates/chess-core", "crates/chess-render", "crates/chess-kindle", "crates/chess-desktop"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
chess-core = { path = "crates/chess-core" }
chess-render = { path = "crates/chess-render" }
primitive-app = { path = "../doannt-kindle-tools/crates/primitive-app" }
primitive-ui = { path = "../doannt-kindle-tools/crates/primitive-ui" }

[profile.release]
lto = true
codegen-units = 1
